<html>

<head>
    <meta charset="UTF-8" />
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
    <link rel="shortcut icon" href="vr-glasses.ico" type="image/x-icon">

    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
            height: 100vh;
        }

        .controls-bottom {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 9999;
            cursor: pointer;
        }

        .opcoes {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 10px;
            border-radius: 10px;
        }

        .controls_rolagem {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 9999;
            cursor: pointer;
        }

        .controls-zoom {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 9999;
            cursor: pointer;
        }


        .controls-side {
            position: fixed;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 9999;
            cursor: pointer;
        }

        .controls-leftside {
            position: fixed;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 9999;
            cursor: pointer;
        }

        .btn {
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 20px;
            user-select: none;
            text-align: center;
        }

        .btn:active {
            background: rgba(0, 0, 0, 0.9);
        }
    </style>
</head>

<body>

    <div class="opcoes">

        <select id="modelSelect">

            <option value="">Selecione um modelo</option>
            <option value="./mobilia/cover_chair.glb">Cadeira 1</option>
            <option value="./mobilia/chair.glb">Cadeira Couro</option>
            <option value="./mobilia/eames_chair.glb">Cadeira Branca</option>
            <option value="./mobilia/cama.glb">Cama</option>
            <option value="./mobilia/mesa_de_centro.glb">Mesa De Centro</option>
            <option value="./mobilia/poltrona_verde.glb">Poltrona Verde</option>
            <option value="./mobilia/poltrona_couro.glb">Poltrona De Couro</option>
            <option value="./mobilia/sofa_branco.glb">Sofa Branco</option>
            <option value="./mobilia/sofa_branco2.glb">Sofa Suede</option>
            <option value="./mobilia/sofa.glb">Sofa</option>
            <option value="./mobilia/sofa_couro_preto.glb">Sofa de Couro Preto</option>
            <option value="./mobilia/geladeira.glb">Geladeira</option>
            <option value="./mobilia/maquina_de_lavar.glb">Máquina de Lavar</option>
        </select>
    </div>


    <!-- Rotação Y -->
    <div class="controls-bottom">
        <div class="btn" id="rotateRight">◀️</div>
        <div class="btn" id="rotateLeft">▶️</div>

    </div>

    <div class="controls_rolagem">

        <div class="btn" id="rollLeft">🔽</div>
        <div class="btn" id="rollRight">🔼</div>

    </div>

    <!-- Barra lateral -->

    <div class="controls-leftside">
        <div class="btn" id="tiltForward">🔼</div>
        <div class="btn" id="tiltBackward">🔽</div>
    </div>

    <div class="controls-side">
        <div class="btn" id="moveUp">🔼</div>
        <div class="btn" id="moveDown">🔽</div>

    </div>

    <!-- Controle de zoom (canto superior direito) -->
    <div class="controls-zoom">
        <div class="btn" id="zoomIn">＋</div>
        <div class="btn" id="zoomOut">－</div>
    </div>


    <a-scene vr-mode-ui="enabled: false" embedded
        arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false;">

        <a-entity id="objeto" position="0 1 -4" rotation="0 -90 0">
            <!-- <a-gltf-model id="modelo" src="./glb/casa_10x8.glb" scale="0.0008 0.0008 0.0008"> -->
            <a-gltf-model id="modelo" src="" scale="2 2 2">

            </a-gltf-model>
        </a-entity>

        <a-camera></a-camera>

    </a-scene>

    <script>
        let dragging = false;
        let pinchStartDistance = 0;
        let initialScale = 2;

        const objeto = document.querySelector("#objeto").object3D;
        const modelo = document.querySelector("#modelo");

        /* ZOOM */
        function getPinchDistance(e) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        window.addEventListener("touchstart", e => {
            if (e.touches.length === 2) {
                pinchStartDistance = getPinchDistance(e);
                initialScale = modelo.getAttribute("scale").x;
            } else if (e.touches.length === 1) {
                dragging = true;
            }
        });

        window.addEventListener("touchend", () => dragging = false);

        window.addEventListener("touchmove", e => {

            if (e.touches.length === 2) {
                const pinchDistance = getPinchDistance(e);
                const scaleFactor = pinchDistance / pinchStartDistance;
                const newScale = initialScale * scaleFactor;

                modelo.setAttribute("scale", {
                    x: newScale,
                    y: newScale,
                    z: newScale
                });

                return;
            }

            if (!dragging || e.touches.length !== 1) return;

            const touch = e.touches[0];
            const xNorm = (touch.clientX / window.innerWidth) * 2 - 1;

            const camera = document.querySelector("a-camera").object3D;

            const vector = new THREE.Vector3(xNorm, 0, -1);
            vector.unproject(camera);

            const distance = 3;
            const dir = vector.sub(camera.position).normalize();
            const newPos = camera.position.clone().add(dir.multiplyScalar(distance));

            objeto.position.x = newPos.x;
            objeto.position.z = newPos.z;
        });

        /* ROT Y */
        document.querySelector("#rotateLeft").addEventListener("click", () => {
            objeto.rotation.y += THREE.Math.degToRad(10);
        });

        document.querySelector("#rotateRight").addEventListener("click", () => {
            objeto.rotation.y -= THREE.Math.degToRad(10);
        });

        /* MOVE Y */
        document.querySelector("#moveUp").addEventListener("click", () => {
            objeto.position.y += 0.2;
        });

        document.querySelector("#moveDown").addEventListener("click", () => {
            objeto.position.y -= 0.2;
        });

        /* PITCH (X) */
        document.querySelector("#tiltForward").addEventListener("click", () => {
            objeto.rotation.x += THREE.Math.degToRad(10);
        });

        document.querySelector("#tiltBackward").addEventListener("click", () => {
            objeto.rotation.x -= THREE.Math.degToRad(10);
        });

        /* ROLL (Z) — ARFAGEM REAL */
        document.querySelector("#rollRight").addEventListener("click", () => {
            objeto.rotation.z += THREE.Math.degToRad(10);
        });

        document.querySelector("#rollLeft").addEventListener("click", () => {
            objeto.rotation.z -= THREE.Math.degToRad(10);
        });

        /* ZOOM DESKTOP (botões + e -) */
        document.querySelector("#zoomIn").addEventListener("click", () => {
            let scale = modelo.getAttribute("scale").x;
            scale += scale * 0.15; // aumenta 15%
            modelo.setAttribute("scale", { x: scale, y: scale, z: scale });
        });

        document.querySelector("#zoomOut").addEventListener("click", () => {
            let scale = modelo.getAttribute("scale").x;
            scale -= scale * 0.15; // diminui 15%
            if (scale < 0.0001) scale = 0.0001; // limite mínimo
            modelo.setAttribute("scale", { x: scale, y: scale, z: scale });
        });

        /* TROCAR MODELO PELO SELECT */
        document.querySelector("#modelSelect").addEventListener("change", (e) => {
            const newModelURL = e.target.value;


            modelo.addEventListener("model-loaded", () => {
                const obj = modelo.getObject3D("mesh");
                if (!obj) return;


                const box = new THREE.Box3().setFromObject(obj);
                const size = box.getSize(new THREE.Vector3());


                const maxDim = Math.max(size.x, size.y, size.z);

    
                const desiredSize = 3; 

                const scaleFactor = desiredSize / maxDim;

  
                modelo.setAttribute("scale", {
                    x: scaleFactor,
                    y: scaleFactor,
                    z: scaleFactor
                });
            });


            // troca o GLB
            modelo.setAttribute("src", newModelURL);

            // opcional: resetar escala ao trocar
            modelo.setAttribute("scale", { x: 2, y: 2, z: 2 });

            // opcional: resetar rotação
            objeto.rotation.set(0, -90 * Math.PI / 180, 0);

            // opcional: resetar posição
            objeto.position.set(0, 1, -4);
        });



    </script>

</body>

</html>
